spring.application.name=resource-service
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resource-db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=none

song-service.url=${API_GATEWAY_URL:http://localhost:8081}

eureka.client.service-url.defaultZone=${SERVICE_REGISTRY_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=${SERVICE_REGISTRY_PREFER_IP:false}
eureka.instance.hostname=${SERVICE_REGISTRY_INSTANCE_HOSTNAME:localhost}

aws.s3.endpoint=${AWS_ENDPOINT_URL:http://localhost:4566}
aws.s3.region=${AWS_REGION:eu-central-1}
aws.s3.bucket=${AWS_BUCKET_NAME:resources-bucket}
aws.s3.access-key=${AWS_ACCESS_KEY_ID:ms-fundamentals}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:ms-fundamentals-secret}
