spring.application.name=resource-service
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resource-db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=none

song-service.url=${API_GATEWAY_URL:http://localhost:8081}

eureka.client.service-url.defaultZone=${SERVICE_REGISTRY_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=${SERVICE_REGISTRY_PREFER_IP:false}
eureka.instance.hostname=${SERVICE_REGISTRY_INSTANCE_HOSTNAME:localhost}

aws.s3.endpoint=${AWS_ENDPOINT_URL:http://localhost:4566}
aws.s3.region=${AWS_REGION:eu-central-1}
aws.s3.access-key=${AWS_ACCESS_KEY_ID:ms-fundamentals}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:ms-fundamentals-secret}

storage-service.url=${STORAGE_SERVICE_URL:http://localhost:8083}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
kafka.topic.resource-events=${KAFKA_TOPIC_RESOURCE_EVENTS:resource-events}
kafka.topic.resource-processed-events=${KAFKA_TOPIC_RESOURCE_PROCESSED_EVENTS:resource-processed-events}
kafka.topic.partitions=${KAFKA_TOPIC_PARTITIONS:1}
kafka.topic.replicas=${KAFKA_TOPIC_REPLICAS:1}
kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID_RESOURCE:resource-service}

retry.max-attempts=${RETRY_MAX_ATTEMPTS:3}
retry.initial-delay=${RETRY_INITIAL_DELAY_MS:1000}
retry.multiplier=${RETRY_MULTIPLIER:2}
retry.kafka.interval-ms=${RETRY_KAFKA_INTERVAL_MS:3000}
retry.kafka.max-attempts=${RETRY_KAFKA_MAX_ATTEMPTS:3}

circuit-breaker.storage-service.sliding-window-size=${CB_STORAGE_SLIDING_WINDOW_SIZE:5}
circuit-breaker.storage-service.failure-rate-threshold=${CB_STORAGE_FAILURE_RATE_THRESHOLD:50}
circuit-breaker.storage-service.wait-duration-seconds=${CB_STORAGE_WAIT_DURATION_SECONDS:10}
circuit-breaker.storage-service.permitted-calls-in-half-open-state=${CB_STORAGE_PERMITTED_CALLS_HALF_OPEN:2}

management.endpoints.web.exposure.include=health,info,prometheus
management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=${ZIPKIN_URL:http://localhost:9411}/api/v2/spans
loki.url=${LOKI_URL:http://localhost:3100}
