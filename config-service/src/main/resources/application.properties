spring.application.name=config-service
server.port=8888

spring.cloud.config.server.git.uri=${CONFIG_REPO_URI:https://github.com/nazar-lysenko/microservices-fundamentals-configs}
spring.cloud.config.server.git.default-label=main
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.force-pull=true

eureka.client.service-url.defaultZone=${SERVICE_REGISTRY_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=${SERVICE_REGISTRY_PREFER_IP:false}
eureka.instance.hostname=${SERVICE_REGISTRY_INSTANCE_HOSTNAME:localhost}

management.endpoints.web.exposure.include=health,info
