services:
  resource-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${RESOURCE_DB_NAME}
      POSTGRES_USER: ${RESOURCE_DB_USER}
      POSTGRES_PASSWORD: ${RESOURCE_DB_PASSWORD}
    ports:
      - "${RESOURCE_DB_PORT}:5432"
    volumes:
      - ./init-scripts/resource-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RESOURCE_DB_USER} -d ${RESOURCE_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  song-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${SONG_DB_NAME}
      POSTGRES_USER: ${SONG_DB_USER}
      POSTGRES_PASSWORD: ${SONG_DB_PASSWORD}
    ports:
      - "${SONG_DB_PORT}:5432"
    volumes:
      - ./init-scripts/song-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONG_DB_USER} -d ${SONG_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  storage-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${STORAGE_DB_NAME}
      POSTGRES_USER: ${STORAGE_DB_USER}
      POSTGRES_PASSWORD: ${STORAGE_DB_PASSWORD}
    ports:
      - "${STORAGE_DB_PORT}:5432"
    volumes:
      - ./init-scripts/storage-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STORAGE_DB_USER} -d ${STORAGE_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  storage-service:
    build: ./storage-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: ${STORAGE_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${STORAGE_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${STORAGE_DB_PASSWORD}
      SERVICE_REGISTRY_URL: ${SERVICE_REGISTRY_URL}
      SERVICE_REGISTRY_PREFER_IP: ${SERVICE_REGISTRY_PREFER_IP}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      LOKI_URL: ${LOKI_URL}
      ZIPKIN_URL: ${ZIPKIN_URL}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      storage-db:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  resource-service:
    build: ./resource-service
    environment:
      SPRING_DATASOURCE_URL: ${RESOURCE_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${RESOURCE_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${RESOURCE_DB_PASSWORD}
      API_GATEWAY_URL: ${API_GATEWAY_URL}
      SERVICE_REGISTRY_URL: ${SERVICE_REGISTRY_URL}
      SERVICE_REGISTRY_PREFER_IP: ${SERVICE_REGISTRY_PREFER_IP}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      STORAGE_SERVICE_URL: ${STORAGE_SERVICE_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC_RESOURCE_EVENTS: ${KAFKA_TOPIC_RESOURCE_EVENTS}
      KAFKA_TOPIC_RESOURCE_PROCESSED_EVENTS: ${KAFKA_TOPIC_RESOURCE_PROCESSED_EVENTS}
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS}
      KAFKA_TOPIC_REPLICAS: ${KAFKA_TOPIC_REPLICAS}
      KAFKA_CONSUMER_GROUP_ID_RESOURCE: ${KAFKA_CONSUMER_GROUP_ID_RESOURCE}
      KEYCLOAK_CLIENT_ID: resource-service
      KEYCLOAK_CLIENT_SECRET: ${RESOURCE_SERVICE_CLIENT_SECRET}
      KEYCLOAK_TOKEN_URI: ${KEYCLOAK_TOKEN_URI}
      LOKI_URL: ${LOKI_URL}
      ZIPKIN_URL: ${ZIPKIN_URL}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      localstack:
        condition: service_healthy
      resource-db:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      kafka:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      storage-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  song-service:
    build: ./song-service
    deploy:
      replicas: 2
    environment:
      SPRING_DATASOURCE_URL: ${SONG_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${SONG_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${SONG_DB_PASSWORD}
      SERVICE_REGISTRY_URL: ${SERVICE_REGISTRY_URL}
      SERVICE_REGISTRY_PREFER_IP: ${SERVICE_REGISTRY_PREFER_IP}
      LOKI_URL: ${LOKI_URL}
      ZIPKIN_URL: ${ZIPKIN_URL}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      song-db:
        condition: service_healthy
      service-registry:
        condition: service_healthy

  resource-processor:
    build: ./resource-processor
    environment:
      SERVICE_REGISTRY_URL: ${SERVICE_REGISTRY_URL}
      SERVICE_REGISTRY_PREFER_IP: ${SERVICE_REGISTRY_PREFER_IP}
      API_GATEWAY_URL: ${API_GATEWAY_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC_RESOURCE_EVENTS: ${KAFKA_TOPIC_RESOURCE_EVENTS}
      KAFKA_TOPIC_RESOURCE_PROCESSED_EVENTS: ${KAFKA_TOPIC_RESOURCE_PROCESSED_EVENTS}
      KAFKA_CONSUMER_GROUP_ID: ${KAFKA_CONSUMER_GROUP_ID}
      KEYCLOAK_CLIENT_ID: resource-processor
      KEYCLOAK_CLIENT_SECRET: ${RESOURCE_PROCESSOR_CLIENT_SECRET}
      KEYCLOAK_TOKEN_URI: ${KEYCLOAK_TOKEN_URI}
      LOKI_URL: ${LOKI_URL}
      ZIPKIN_URL: ${ZIPKIN_URL}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      service-registry:
        condition: service_healthy
      kafka:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  service-registry:
    build: ./service-registry
    ports:
      - "${SERVICE_REGISTRY_PORT}:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      SERVICE_REGISTRY_PORT: ${SERVICE_REGISTRY_PORT}
      LOKI_URL: ${LOKI_URL}
      ZIPKIN_URL: ${ZIPKIN_URL}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
    restart: on-failure

  api-gateway:
    build: ./api-gateway
    ports:
      - "${API_GATEWAY_PORT}:8084"
    environment:
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
      SERVICE_REGISTRY_URL: ${SERVICE_REGISTRY_URL}
      SERVICE_REGISTRY_PREFER_IP: ${SERVICE_REGISTRY_PREFER_IP}
      API_GATEWAY_PORT: ${API_GATEWAY_PORT}
      API_GATEWAY_CACHE_TTL: ${API_GATEWAY_CACHE_TTL}
      API_GATEWAY_LOG_LEVEL: ${API_GATEWAY_LOG_LEVEL}
      SERVICE_REGISTRY_CLIENT_FETCH_INTERVAL_SECONDS: ${SERVICE_REGISTRY_CLIENT_FETCH_INTERVAL_SECONDS}
      SERVICE_REGISTRY_CLIENT_LEASE_RENEWAL_INTERVAL_SECONDS: ${SERVICE_REGISTRY_CLIENT_LEASE_RENEWAL_INTERVAL_SECONDS}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      LOKI_URL: ${LOKI_URL}
      ZIPKIN_URL: ${ZIPKIN_URL}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,refresh"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      service-registry:
        condition: service_healthy
      config-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "${KAFKA_EXTERNAL_PORT}:29092"
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID}
      KAFKA_PROCESS_ROLES: ${KAFKA_PROCESS_ROLES}
      KAFKA_LISTENERS: ${KAFKA_LISTENERS}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
      KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER_NAME}
      KAFKA_CONTROLLER_LISTENER_NAMES: ${KAFKA_CONTROLLER_LISTENER_NAMES}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR}
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  localstack:
    image: localstack/localstack:3
    ports:
      - "${LOCALSTACK_PORT}:4566"
    environment:
      SERVICES: ${LOCALSTACK_SERVICES}
      DEFAULT_REGION: ${AWS_REGION}
      AWS_DEFAULT_REGION: ${AWS_REGION}
    volumes:
      - ./init-scripts/localstack:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: start-dev --import-realm
    ports:
      - "${KEYCLOAK_PORT}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
    volumes:
      - ./init-scripts/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/microservices HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  config-service:
    build: ./config-service
    ports:
      - "${CONFIG_SERVICE_PORT}:8888"
    environment:
      CONFIG_REPO_URI: ${CONFIG_REPO_URI}
      SERVICE_REGISTRY_URL: ${SERVICE_REGISTRY_URL}
      SERVICE_REGISTRY_PREFER_IP: ${SERVICE_REGISTRY_PREFER_IP}
      LOKI_URL: ${LOKI_URL}
      ZIPKIN_URL: ${ZIPKIN_URL}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      service-registry:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

  loki:
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml

  zipkin:
    image: openzipkin/zipkin:3
    ports:
      - "9411:9411"

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
      - loki
      - zipkin
