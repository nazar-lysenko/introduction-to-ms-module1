gateway.url=http://localhost:8084
e2e.storage-service.url=http://localhost:8083
spring.main.web-application-type=none

keycloak.token-url=http://localhost:8180/realms/microservices/protocol/openid-connect/token
keycloak.client-id=postman-client
keycloak.admin.username=admin-user
keycloak.admin.password=admin
keycloak.user.username=regular-user
keycloak.user.password=user

e2e.health-check.path=/resources/99999
e2e.health-check.timeout-seconds=10
e2e.health-check.poll-interval-seconds=3
e2e.processing.timeout-seconds=30
e2e.processing.poll-interval-seconds=2
e2e.deletion.timeout-seconds=10
e2e.deletion.poll-interval-seconds=1
e2e.resilience.processor-restart.timeout-seconds=60
e2e.resilience.processor-restart.poll-interval-seconds=3
e2e.resilience.heavy-load.timeout-seconds=45
e2e.resilience.heavy-load.poll-interval-seconds=2
