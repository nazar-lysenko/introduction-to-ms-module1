spring.application.name=resource-processor
server.port=8082

eureka.client.service-url.defaultZone=${SERVICE_REGISTRY_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=${SERVICE_REGISTRY_PREFER_IP:false}
eureka.instance.hostname=${SERVICE_REGISTRY_INSTANCE_HOSTNAME:localhost}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:resource-processor}
kafka.topic.resource-events=${KAFKA_TOPIC_RESOURCE_EVENTS:resource-events}
kafka.topic.resource-processed-events=${KAFKA_TOPIC_RESOURCE_PROCESSED_EVENTS:resource-processed-events}

resource-service.url=${API_GATEWAY_URL:http://localhost:8084}
song-service.url=${API_GATEWAY_URL:http://localhost:8084}

retry.max-attempts=${RETRY_MAX_ATTEMPTS:3}
retry.initial-delay=${RETRY_INITIAL_DELAY_MS:1000}
retry.multiplier=${RETRY_MULTIPLIER:2}
retry.kafka.interval-ms=${RETRY_KAFKA_INTERVAL_MS:3000}
retry.kafka.max-attempts=${RETRY_KAFKA_MAX_ATTEMPTS:3}

management.endpoints.web.exposure.include=health,info,prometheus
management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=${ZIPKIN_URL:http://localhost:9411}/api/v2/spans
loki.url=${LOKI_URL:http://localhost:3100}

spring.security.oauth2.client.registration.keycloak.client-id=${KEYCLOAK_CLIENT_ID:resource-processor}
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:resource-processor-secret}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.keycloak.scope=openid
spring.security.oauth2.client.provider.keycloak.token-uri=${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/microservices/protocol/openid-connect/token}
security.token-relay.enabled=${SECURITY_TOKEN_RELAY_ENABLED:true}

